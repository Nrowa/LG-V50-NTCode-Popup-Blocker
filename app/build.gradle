plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nrowa.ntcodepopup'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nrowa.ntcodepopup'
        minSdk 26
        targetSdk 32
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Legacy Xposed API supported by LSPosed 1.9.x.
    compileOnly 'de.robv.android.xposed:api:82'
}
